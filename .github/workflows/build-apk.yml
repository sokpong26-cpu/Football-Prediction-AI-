name: Build Android APK
cd android
./gradlew clean
./gradlew assembleDebug
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies & build offline bundle
        run: |
          npm ci || npm install
          npm run build
          node scripts/sync-android-assets.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload AppleOfFortuneAI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleOfFortuneAI-APK
          path: android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/debug/app-debug.apk
          - name: Install web dependencies & build
  working-directory: ./web # adjust to your folder name
  run: npm ciname: build-apk
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies & build
        run: npm ci
        # If your web project is in a subfolder, add:
        # working-directory: ./web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        # If your Android project is in a subfolder (e.g., ./android), add:
        # working-directory: ./android

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
          
  
