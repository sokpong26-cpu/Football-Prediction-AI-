name: Build Android APK
cd android
./gradlew clean
./gradlew assembleDebug
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies & build offline bundle
        run: |
          npm ci || npm install
          npm run build
          node scripts/sync-android-assets.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload AppleOfFortuneAI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleOfFortuneAI-APK
          path: android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/debug/app-debug.apk
          - name: Install web dependencies & build
  working-directory: ./web # adjust to your folder name
  run: npm ci
  
