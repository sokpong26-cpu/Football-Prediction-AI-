<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1b3a24"/>
      <stop offset="100%" stop-color="#08120a"/>
    </radialGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="60%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#22c55e" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Glowing green circle -->
  <circle cx="256" cy="270" r="150" fill="#22c55e" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Apple Stem & Leaf -->
  <path d="M256 160 C256 120, 270 100, 290 85 C295 90, 298 100, 295 115 C290 135, 270 155, 256 160 Z" fill="#78350f"/>
  <path d="M260 145 C295 110, 360 115, 375 145 C350 165, 280 160, 260 145 Z" fill="url(#leafGrad)"/>

  <!-- Apple Body -->
  <path d="M256 195 C230 170, 150 170, 130 240 C110 320, 175 420, 256 420 C337 420, 402 320, 382 240 C362 170, 282 170, 256 195 Z" fill="url(#appleGrad)" filter="url(#glow)"/>

  <!-- Highlight Reflection -->
  <ellipse cx="190" cy="245" rx="35" ry="55" transform="rotate(-28 190 245)" fill="#ffffff" fill-opacity="0.3"/>

  <!-- Crown on Top -->
  <path d="M196 150 L220 180 L256 140 L292 180 L316 150 L310 195 L202 195 Z" fill="url(#goldGrad)"/>
  <circle cx="196" cy="146" r="6" fill="#fde047"/>
  <circle cx="256" cy="136" r="7" fill="#fde047"/>
  <circle cx="316" cy="146" r="6" fill="#fde047"/>

  <!-- Star Sparkles -->
  <text x="256" y="468" font-family="sans-serif" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle" letter-spacing="4">APPLE OF FORTUNE</text>
</svg>
